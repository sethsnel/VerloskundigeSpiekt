services:
  postgres:
    image: postgres:17.5-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-verloskundigespiekt}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      Database__ConnectionString: Host=postgres;Port=5432;Database=${POSTGRES_DB:-verloskundigespiekt};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres};SSL Mode=Disable;Maximum Pool Size=10;Timeout=5
      Firebase__ProjectId: ${Firebase__ProjectId:-verloskundigespiekt-dev}
      Firebase__AllowedOrigins__0: http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres-data:
