name: frontend

on:
  push:
    paths: ["frontend/**", "pnpm-lock.yaml", "pnpm-workspace.yaml", ".github/workflows/frontend.yml"]
  pull_request:
    paths: ["frontend/**", "pnpm-lock.yaml", "pnpm-workspace.yaml", ".github/workflows/frontend.yml"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_CHANNEL: VerloskundigeSpiekt
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
      NEXT_PUBLIC_AZURE_SEARCH_ENDPOINT: https://example.invalid
      NEXT_PUBLIC_AZURE_SEARCH_API_KEY: ci-placeholder
      NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-placeholder
      NEXT_PUBLIC_FIREBASE_DATABASE_URL: https://example.invalid
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-placeholder
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci-placeholder
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ci-placeholder
      NEXT_PUBLIC_FIREBASE_APP_ID: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter frontend exec tsc --noEmit
      - run: pnpm --filter frontend build
