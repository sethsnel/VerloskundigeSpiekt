name: frontend

on:
  push:
    paths: ["frontend/**", "extension/**", "tools/migration-firestore-postgres/**", "pnpm-lock.yaml", "pnpm-workspace.yaml", ".github/workflows/frontend.yml"]
  pull_request:
    paths: ["frontend/**", "extension/**", "tools/migration-firestore-postgres/**", "pnpm-lock.yaml", "pnpm-workspace.yaml", ".github/workflows/frontend.yml"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_CHANNEL: VerloskundigeSpiekt
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
      NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-placeholder
      NEXT_PUBLIC_FIREBASE_DATABASE_URL: https://example.invalid
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-placeholder
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci-placeholder
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ci-placeholder
      NEXT_PUBLIC_FIREBASE_APP_ID: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - run: pnpm --filter frontend exec tsc --noEmit
      - run: pnpm --filter frontend lint
      - name: Prevent application-domain Firestore and direct search imports
        run: |
          ! grep -R --include='*.ts' --include='*.tsx' -E "firebase/firestore|@azure/search-documents|lib/firestore" frontend
      - run: pnpm --filter frontend build
      - run: pnpm --filter frontend test:component
      - run: pnpm --filter frontend exec playwright install --with-deps chromium
      - run: pnpm --filter frontend test:e2e
      - run: npm test
        working-directory: extension
      - run: node --check background.js && node --check popup.js
        working-directory: extension
      - run: pnpm install --ignore-workspace --frozen-lockfile
        working-directory: tools/migration-firestore-postgres
      - run: pnpm run typecheck && pnpm test && pnpm audit --prod --audit-level high
        working-directory: tools/migration-firestore-postgres
